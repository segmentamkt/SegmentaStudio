name: Sync Segmenta Studio app

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-segmenta-studio.yml'
      - 'segmenta-studio-source.b64'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout official repository
        uses: actions/checkout@v4

      - name: Rebuild the temporary source package
        run: base64 --decode segmenta-studio-source.b64 > /tmp/segmenta-studio.zip

      - name: Place the app in its canonical directory
        run: |
          mkdir -p apps/studio-web
          unzip -oq /tmp/segmenta-studio.zip -d apps/studio-web

      - name: Publish the app and remove the temporary package
        run: |
          git config user.name 'Segmenta Studio Bot'
          git config user.email 'segmenta-studio@users.noreply.github.com'
          git add apps/studio-web
          git rm segmenta-studio-source.b64
          git commit -m 'Publicar aplicación web Segmenta Studio'
          git push
